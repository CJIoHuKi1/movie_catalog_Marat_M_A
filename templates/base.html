<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинотека - {% block title %}Каталог фильмов{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .movie-card { transition: transform 0.2s; margin-bottom: 20px; }
        .movie-card:hover { transform: translateY(-5px); }
        .rating-star { color: gold; }
        .poster-placeholder { background-color: #f8f9fa; height: 200px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">🎬 Кинотека</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('index') }}">Главная</a>
                <a class="nav-link" href="{{ url_for('add') }}">➕ Добавить фильм</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center text-muted mt-5 mb-3">
        <small>Кинотека — каталог фильмов с оценками</small>
    </footer>
</body>
</html>
