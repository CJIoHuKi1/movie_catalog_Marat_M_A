{% extends "base.html" %}

{% block title %}Добавить фильм{% endblock %}

{% block content %}
<h1>➕ Добавить фильм</h1>

{% if errors %}
    <div class="alert alert-danger">
        <ul>
            {% for error in errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
{% endif %}

<form method="POST">
    <div class="mb-3">
        <label for="title" class="form-label">Название фильма *</label>
        <input type="text" class="form-control" id="title" name="title" value="{{ form_data.title or '' }}" required>
    </div>
    
    <div class="mb-3">
        <label for="director" class="form-label">Режиссёр *</label>
        <input type="text" class="form-control" id="director" name="director" value="{{ form_data.director or '' }}" required>
    </div>
    
    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="year" class="form-label">Год выпуска *</label>
            <input type="number" class="form-control" id="year" name="year" value="{{ form_data.year or '' }}" min="1888" max="2026" required>
        </div>
        <div class="col-md-6 mb-3">
    <label for="rating" class="form-label">Оценка (1–10, можно с десятыми) *</label>
    <input type="number" class="form-control" id="rating" name="rating" value="{{ form_data.rating or '' }}" min="1" max="10" step="0.1" required>
        </div>
    </div>
    
    <div class="mb-3">
        <label for="genre" class="form-label">Жанр *</label>
        <select class="form-select" id="genre" name="genre" required>
            <option value="">Выберите жанр</option>
            <option value="Боевик" {% if form_data.genre == 'Боевик' %}selected{% endif %}>Боевик</option>
            <option value="Комедия" {% if form_data.genre == 'Комедия' %}selected{% endif %}>Комедия</option>
            <option value="Драма" {% if form_data.genre == 'Драма' %}selected{% endif %}>Драма</option>
            <option value="Фантастика" {% if form_data.genre == 'Фантастика' %}selected{% endif %}>Фантастика</option>
            <option value="Ужасы" {% if form_data.genre == 'Ужасы' %}selected{% endif %}>Ужасы</option>
            <option value="Триллер" {% if form_data.genre == 'Триллер' %}selected{% endif %}>Триллер</option>
            <option value="Мелодрама" {% if form_data.genre == 'Мелодрама' %}selected{% endif %}>Мелодрама</option>
            <option value="Детектив" {% if form_data.genre == 'Детектив' %}selected{% endif %}>Детектив</option>
        </select>
    </div>
    
    <div class="mb-3">
        <label for="description" class="form-label">Описание</label>
        <textarea class="form-control" id="description" name="description" rows="3">{{ form_data.description or '' }}</textarea>
    </div>
    
    <div class="mb-3">
        <label for="poster_url" class="form-label">Ссылка на постер</label>
        <input type="url" class="form-control" id="poster_url" name="poster_url" value="{{ form_data.poster_url or '' }}" placeholder="https://example.com/poster.jpg">
    </div>
    
    <button type="submit" class="btn btn-primary">💾 Сохранить</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
